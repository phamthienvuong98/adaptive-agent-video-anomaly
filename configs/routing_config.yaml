# configs/routing_config.yaml
# Cấu hình Routing Agent — multi-signal weights và tier thresholds
# Tham khảo: PLAN.md §5.2

routing_agent:
  # Signal weights (tổng = 1.0)
  weights:
    motion: 0.35       # Optical flow mean magnitude
    person: 0.25       # Person count từ MoveNet
    complexity: 0.20   # Scene entropy từ MobileNetV3
    context: 0.20      # Camera risk level

  # Tier boundaries
  tier_thresholds: [0.35, 0.70]
  # score < 0.35  → Tier 1 (~94% frames): MobileNetV3 anomaly scorer
  # score 0.35–0.7 → Tier 2 (~5% frames): CLIP zero-shot
  # score > 0.70  → Tier 3 (~1% frames): Qwen2.5-VL dialogue

  # Night-time risk multiplier
  night_multiplier: 1.3
  # is_night = True nếu hour < 6 hoặc hour >= 22

  # Normalization upper bounds cho từng signal
  normalization_ranges:
    motion_mean: 5.0        # max expected mean optical flow magnitude
    person_count: 20.0      # max người trong frame bình thường
    scene_complexity: 4.0   # max entropy (~ln(576) ≈ 6.35, nhưng thực tế ~4)

  # Tier 1 safety net: escalate nếu MobileNetV3 score vượt ngưỡng này
  tier1_escalate_threshold: 0.5

  # Tier 2 escalate: escalate lên Tier 3 nếu CLIP score vượt ngưỡng này
  tier2_escalate_threshold: 0.65
